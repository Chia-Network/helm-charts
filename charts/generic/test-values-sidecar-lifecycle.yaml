# Test values to verify sidecar lifecycle hooks and the pod's termination grace period render
mode: deployment
replicaCount: 1
image:
  repository: nginx
  tag: latest
deployment:
  containerPort: 80
  containerPortName: http
terminationGracePeriodSeconds: 600
sidecars:
  - name: with-hook
    image:
      repository: busybox
      tag: latest
      pullPolicy: IfNotPresent
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 5"]
  - name: without-hook
    image:
      repository: busybox
      tag: latest
      pullPolicy: IfNotPresent
